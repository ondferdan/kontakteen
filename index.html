<style>
:root {
  --bg: #F5F0FF;
  --text: #1A1A2E;
  --muted: #9494AA;
  --user-color: #3A0CA3;
  --user-light: #E0D7FF;
}
* { box-sizing: border-box; margin: 0; padding: 0; -webkit-tap-highlight-color: transparent; }
html, body { height: 100%; font-family: 'Nunito', sans-serif; background: var(--bg); overflow: hidden; }

.screen { display: none; width: 100%; height: 100%; flex-direction: column; }
.screen.active { display: flex; }

/* WELCOME */
#welcome-screen {
  background: linear-gradient(150deg, #3A0CA3 0%, #7B2FBE 50%, #F72585 100%);
  overflow-y: auto; overflow-x: hidden;
  align-items: center; justify-content: flex-start;
  padding: 24px 16px 48px;
  -webkit-overflow-scrolling: touch;
}
#welcome-screen::-webkit-scrollbar { width: 0; }

.welcome-card {
  background: rgba(255,255,255,0.1);
  backdrop-filter: blur(20px);
  border: 1px solid rgba(255,255,255,0.2);
  border-radius: 24px;
  padding: 24px 18px;
  width: 100%; max-width: 360px;
  text-align: center; flex-shrink: 0;
}
.welcome-logo { font-size: 46px; margin-bottom: 6px; }
.welcome-title { font-family:'Caveat',cursive; font-size:28px; font-weight:700; color:white; margin-bottom:3px; }
.welcome-sub { font-size:12px; color:rgba(255,255,255,0.65); font-weight:600; margin-bottom:18px; }

.tabs { display:flex; background:rgba(255,255,255,0.1); border-radius:12px; padding:3px; margin-bottom:16px; }
.tab { flex:1; padding:8px; border:none; border-radius:9px; font-family:'Nunito',sans-serif; font-size:13px; font-weight:800; cursor:pointer; background:transparent; color:rgba(255,255,255,0.6); transition:all 0.2s; }
.tab.active { background:white; color:#3A0CA3; }

.form-section { display:none; }
.form-section.active { display:block; }

.emoji-selector { display:flex; flex-wrap:wrap; gap:5px; justify-content:center; margin-bottom:12px; }
.emoji-opt { font-size:24px; padding:5px; border-radius:9px; cursor:pointer; border:2px solid transparent; background:rgba(255,255,255,0.1); transition:all 0.15s; }
.emoji-opt.selected { border-color:white; background:rgba(255,255,255,0.25); transform:scale(1.15); }

.field { width:100%; background:rgba(255,255,255,0.12); border:2px solid rgba(255,255,255,0.2); border-radius:12px; padding:10px 14px; font-family:'Nunito',sans-serif; font-size:15px; font-weight:700; color:white; outline:none; margin-bottom:10px; text-align:center; }
.field::placeholder { color:rgba(255,255,255,0.4); }
.field:focus { border-color:rgba(255,255,255,0.6); }

.pin-dots { display:flex; justify-content:center; gap:12px; margin:10px 0; }
.pin-dot { width:13px; height:13px; border-radius:50%; border:2px solid rgba(255,255,255,0.4); transition:all 0.2s; }
.pin-dot.filled { background:white; border-color:white; transform:scale(1.2); }

.keypad { display:grid; grid-template-columns:repeat(3,1fr); gap:7px; }
.key { background:rgba(255,255,255,0.12); border:1px solid rgba(255,255,255,0.15); border-radius:12px; padding:13px 8px; color:white; font-family:'Nunito',sans-serif; font-size:20px; font-weight:800; cursor:pointer; transition:all 0.15s; user-select:none; touch-action:manipulation; }
.key:active { background:rgba(255,255,255,0.3); transform:scale(0.92); }
.key.empty { visibility:hidden; }

.btn-primary { width:100%; padding:12px; background:white; color:#3A0CA3; border:none; border-radius:12px; font-family:'Nunito',sans-serif; font-size:15px; font-weight:900; cursor:pointer; margin-top:10px; touch-action:manipulation; }
.btn-primary:active { opacity:0.85; }

.form-error { color:#FFB3C1; font-size:12px; font-weight:700; min-height:18px; margin-top:6px; }
.form-info { color:rgba(255,255,255,0.7); font-size:12px; font-weight:700; min-height:18px; margin-top:6px; }

.members-list { display:flex; flex-direction:column; gap:7px; margin-bottom:10px; max-height:180px; overflow-y:auto; }
.member-row { display:flex; align-items:center; gap:10px; background:rgba(255,255,255,0.1); border-radius:12px; padding:9px 12px; border:2px solid transparent; }
.member-emoji { font-size:22px; }
.member-name { color:white; font-size:14px; font-weight:800; flex:1; text-align:left; }
.member-badge { font-size:10px; background:rgba(255,255,255,0.2); color:white; padding:2px 7px; border-radius:8px; font-weight:700; }

/* CHAT */
#chat-screen { background: var(--bg); }

.chat-header {
  background: var(--user-color);
  padding: 12px 14px;
  padding-top: max(env(safe-area-inset-top,0px), 12px);
  display:flex; align-items:center; gap:10px;
  box-shadow: 0 3px 16px rgba(0,0,0,0.15);
  flex-shrink: 0;
}
.members-row { display:flex; }
.h-av { width:32px; height:32px; border-radius:50%; border:2px solid rgba(255,255,255,0.3); display:flex; align-items:center; justify-content:center; font-size:15px; background:rgba(255,255,255,0.15); margin-left:-6px; flex-shrink:0; }
.h-av:first-child { margin-left:0; }
.header-info { flex:1; }
.header-info h2 { color:white; font-size:15px; font-weight:900; }
.header-info p { color:rgba(255,255,255,0.65); font-size:11px; font-weight:600; }
.online-dot { display:inline-block; width:6px; height:6px; background:#B9FBC0; border-radius:50%; margin-right:4px; animation:pulse 2s infinite; }
@keyframes pulse { 0%,100%{opacity:1} 50%{opacity:0.4} }
.btn-menu { background:rgba(255,255,255,0.15); border:none; border-radius:10px; color:white; padding:6px 10px; font-size:18px; cursor:pointer; touch-action:manipulation; }

.messages-area { flex:1; overflow-y:auto; overflow-x:hidden; padding:12px 10px; display:flex; flex-direction:column; gap:5px; -webkit-overflow-scrolling:touch; }
.messages-area::-webkit-scrollbar { width:0; }

.date-label { text-align:center; font-size:11px; color:var(--muted); font-weight:800; margin:6px 0 3px; }

.msg-row { display:flex; align-items:flex-end; gap:6px; animation:msgIn 0.2s ease; }
@keyframes msgIn { from{opacity:0;transform:translateY(8px)} to{opacity:1;transform:translateY(0)} }
.msg-row.me { flex-direction:row-reverse; }
.msg-av { width:28px; height:28px; border-radius:50%; display:flex; align-items:center; justify-content:center; font-size:14px; flex-shrink:0; }
.msg-content { max-width:75%; display:flex; flex-direction:column; gap:2px; }
.msg-row.me .msg-content { align-items:flex-end; }
.sender-name { font-size:10px; font-weight:800; color:var(--muted); padding:0 3px; }
.bubble { padding:8px 12px; border-radius:16px; font-size:14px; line-height:1.5; font-weight:600; word-break:break-word; }
.bubble.them { background:white; color:var(--text); border-bottom-left-radius:3px; box-shadow:0 1px 6px rgba(0,0,0,0.07); }
.bubble.me { background:var(--user-color); color:white; border-bottom-right-radius:3px; }
.bubble.photo-bubble { padding:4px; }
.bubble.photo-bubble.them { border-bottom-left-radius:3px; background:white; }
.bubble.photo-bubble.me { border-bottom-right-radius:3px; border-bottom-left-radius:16px; }
.bubble img { width:180px; max-width:100%; height:140px; object-fit:cover; border-radius:12px; display:block; cursor:pointer; }
.msg-time { font-size:10px; color:var(--muted); font-weight:700; padding:0 3px; }

.empty-chat { display:flex; flex-direction:column; align-items:center; justify-content:center; flex:1; gap:8px; color:var(--muted); font-weight:700; font-size:14px; text-align:center; padding:20px; }
.empty-chat span { font-size:40px; }

.emoji-picker { display:none; flex-wrap:wrap; gap:4px; padding:8px 10px; background:white; border-top:1px solid rgba(0,0,0,0.06); max-height:100px; overflow-y:auto; flex-shrink:0; }
.emoji-picker.open { display:flex; }
.ep-btn { font-size:22px; cursor:pointer; border:none; background:none; border-radius:7px; padding:3px; touch-action:manipulation; }

.input-area { background:white; border-top:1px solid rgba(0,0,0,0.06); flex-shrink:0; padding-bottom:env(safe-area-inset-bottom,0); }
.photo-preview-wrap { display:none; align-items:center; gap:8px; padding:7px 10px 0; }
.photo-preview-wrap.visible { display:flex; }
.photo-preview-wrap img { width:48px; height:48px; object-fit:cover; border-radius:9px; border:2px solid var(--user-color); }
.photo-preview-wrap button { background:none; border:none; cursor:pointer; font-size:18px; color:var(--muted); }
.photo-preview-wrap span { font-size:11px; font-weight:700; color:var(--muted); }
.input-row { display:flex; align-items:center; gap:7px; padding:8px 10px; }
.btn-c { width:38px; height:38px; border-radius:50%; border:none; display:flex; align-items:center; justify-content:center; font-size:17px; cursor:pointer; flex-shrink:0; touch-action:manipulation; }
.btn-c:active { opacity:0.7; transform:scale(0.92); }
.btn-emoji-c { background:#F3EEFF; }
.btn-photo-c { background:var(--user-light); }
.btn-send-c { background:var(--user-color); color:white; font-size:14px; }
.input-field { flex:1; background:var(--bg); border:2px solid transparent; border-radius:20px; padding:8px 13px; font-family:'Nunito',sans-serif; font-size:14px; font-weight:600; color:var(--text); outline:none; min-width:0; }
.input-field:focus { border-color:var(--user-color); }
.input-field::placeholder { color:var(--muted); }
#photo-input { display:none; }

/* SIDE PANEL */
.side-panel { display:none; position:fixed; top:0; right:0; bottom:0; width:260px; background:white; z-index:100; box-shadow:-4px 0 30px rgba(0,0,0,0.12); flex-direction:column; padding:20px 14px; overflow-y:auto; }
.side-panel.open { display:flex; }
.panel-title { font-size:17px; font-weight:900; color:var(--text); margin-bottom:14px; display:flex; justify-content:space-between; align-items:center; flex-shrink:0; }
.panel-close { background:none; border:none; font-size:22px; cursor:pointer; color:var(--muted); }
.panel-member { display:flex; align-items:center; gap:10px; padding:9px 11px; border-radius:12px; margin-bottom:5px; }
.panel-member-av { font-size:26px; }
.panel-member-info h4 { font-size:13px; font-weight:800; color:var(--text); }
.panel-member-info p { font-size:11px; font-weight:600; }
.admin-tag { background:#E0D7FF; color:#3A0CA3; font-size:10px; font-weight:800; padding:1px 7px; border-radius:7px; margin-left:5px; }
.panel-divider { height:1px; background:rgba(0,0,0,0.06); margin:10px 0; flex-shrink:0; }
.btn-panel-action { width:100%; padding:11px; background:var(--bg); border:none; border-radius:12px; font-family:'Nunito',sans-serif; font-size:14px; font-weight:800; cursor:pointer; margin-bottom:6px; touch-action:manipulation; text-align:left; }
.btn-panel-logout { color:var(--muted); }
.btn-panel-admin { color:#3A0CA3; }

/* ADMIN */
.admin-user-row { border-radius:12px; padding:10px 12px; margin-bottom:8px; }
.admin-user-top { display:flex; align-items:center; gap:8px; margin-bottom:8px; }
.admin-user-av { font-size:22px; }
.admin-user-name { font-size:13px; font-weight:800; color:var(--text); flex:1; }
.role-tag { font-size:10px; font-weight:800; padding:2px 8px; border-radius:8px; }
.role-admin { background:#E0D7FF; color:#3A0CA3; }
.role-member { background:#E0E0E0; color:#555; }
.admin-actions { display:flex; gap:6px; flex-wrap:wrap; }
.btn-admin { padding:6px 11px; border:none; border-radius:9px; font-family:'Nunito',sans-serif; font-size:12px; font-weight:800; cursor:pointer; touch-action:manipulation; }
.btn-del { background:#FFE0E0; color:#C0392B; }
.btn-role { background:#E0F0FF; color:#1565C0; }

.overlay { display:none; position:fixed; inset:0; background:rgba(0,0,0,0.3); z-index:99; }
.overlay.open { display:block; }

.toast { position:fixed; bottom:80px; left:50%; transform:translateX(-50%) translateY(20px); background:rgba(26,26,46,0.9); color:white; padding:9px 18px; border-radius:18px; font-size:13px; font-weight:700; opacity:0; transition:all 0.3s; z-index:999; white-space:nowrap; pointer-events:none; }
.toast.show { opacity:1; transform:translateX(-50%) translateY(0); }
</style>
<link rel="manifest" href="manifest.json">
<meta name="theme-color" content="#3A0CA3">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
</head>
<body>

<!-- WELCOME -->
<div id="welcome-screen" class="screen active">
  <div class="welcome-card">
    <div class="welcome-logo">👨‍👦</div>
    <div class="welcome-title">Kontakteen Ferdaan</div>
    <div class="welcome-sub">Soukromý prostor Ferdaanů</div>

    <div class="tabs">
      <button class="tab active" id="tab-login" onclick="switchTab('login')">Přihlásit se</button>
      <button class="tab" id="tab-reg" onclick="switchTab('register')">Nový účet</button>
    </div>

    <!-- LOGIN -->
    <div class="form-section active" id="form-login">
      <div class="members-list" id="members-list">
        <div style="color:rgba(255,255,255,0.5);font-size:13px;font-weight:700;text-align:center;padding:8px">Načítám…</div>
      </div>
      <div class="pin-dots" id="login-dots">
        <div class="pin-dot" id="ld0"></div><div class="pin-dot" id="ld1"></div>
        <div class="pin-dot" id="ld2"></div><div class="pin-dot" id="ld3"></div>
      </div>
      <div class="keypad">
        <button class="key" onclick="pressKey('l','1')">1</button>
        <button class="key" onclick="pressKey('l','2')">2</button>
        <button class="key" onclick="pressKey('l','3')">3</button>
        <button class="key" onclick="pressKey('l','4')">4</button>
        <button class="key" onclick="pressKey('l','5')">5</button>
        <button class="key" onclick="pressKey('l','6')">6</button>
        <button class="key" onclick="pressKey('l','7')">7</button>
        <button class="key" onclick="pressKey('l','8')">8</button>
        <button class="key" onclick="pressKey('l','9')">9</button>
        <button class="key empty"></button>
        <button class="key" onclick="pressKey('l','0')">0</button>
        <button class="key" onclick="delKey('l')">⌫</button>
      </div>
      <div class="form-error" id="login-error"></div>
    </div>

    <!-- REGISTER -->
    <div class="form-section" id="form-register">
      <div style="color:rgba(255,255,255,0.7);font-size:12px;font-weight:700;margin-bottom:8px">Vyber si avatara:</div>
      <div class="emoji-selector" id="emoji-selector"></div>
      <input class="field" type="text" id="reg-name" placeholder="Tvoje jméno" maxlength="16" autocomplete="off">
      <div style="color:rgba(255,255,255,0.7);font-size:12px;font-weight:700;margin-bottom:6px">Zvol PIN (4 číslice):</div>
      <div class="pin-dots" id="reg-dots">
        <div class="pin-dot" id="rd0"></div><div class="pin-dot" id="rd1"></div>
        <div class="pin-dot" id="rd2"></div><div class="pin-dot" id="rd3"></div>
      </div>
      <div class="keypad">
        <button class="key" onclick="pressKey('r','1')">1</button>
        <button class="key" onclick="pressKey('r','2')">2</button>
        <button class="key" onclick="pressKey('r','3')">3</button>
        <button class="key" onclick="pressKey('r','4')">4</button>
        <button class="key" onclick="pressKey('r','5')">5</button>
        <button class="key" onclick="pressKey('r','6')">6</button>
        <button class="key" onclick="pressKey('r','7')">7</button>
        <button class="key" onclick="pressKey('r','8')">8</button>
        <button class="key" onclick="pressKey('r','9')">9</button>
        <button class="key empty"></button>
        <button class="key" onclick="pressKey('r','0')">0</button>
        <button class="key" onclick="delKey('r')">⌫</button>
      </div>
      <button class="btn-primary" onclick="doRegister()">✅ Vytvořit účet</button>
      <div class="form-error" id="reg-error"></div>
      <div class="form-info" id="reg-info"></div>
    </div>
  </div>
</div>

<!-- CHAT -->
<div id="chat-screen" class="screen">
  <div class="chat-header">
    <div class="members-row" id="header-members"></div>
    <div class="header-info">
      <h2>Kontakteen Ferdaan</h2>
      <p><span class="online-dot"></span>Soukromý prostor</p>
    </div>
    <button class="btn-menu" onclick="openPanel('members')">👥</button>
  </div>
  <div class="messages-area" id="messages-area">
    <div class="empty-chat"><span>💬</span>Zatím žádné zprávy<br>Napiš první!</div>
  </div>
  <div class="input-area">
    <div class="photo-preview-wrap" id="photo-preview-wrap">
      <img id="photo-preview-img" src="" alt="">
      <button onclick="clearPhoto()">✕</button>
      <span>Fotka připravena</span>
    </div>
    <div class="input-row">
      <button class="btn-c btn-emoji-c" id="emoji-toggle">😊</button>
      <input class="input-field" type="text" id="msg-input" placeholder="Napiš zprávu…" autocomplete="off">
      <button class="btn-c btn-photo-c" onclick="document.getElementById('photo-input-gallery').click()" title="Galerie">🖼️</button>
      <button class="btn-c btn-photo-c" onclick="document.getElementById('photo-input-camera').click()" title="Fotoaparát">📷</button>
      <button class="btn-c btn-send-c" onclick="sendMsg()">➤</button>
    </div>
    <div class="emoji-picker" id="emoji-picker"></div>
  </div>
</div>

<!-- MEMBERS PANEL -->
<div class="overlay" id="overlay" onclick="closePanel()"></div>
<div class="side-panel" id="members-panel">
  <div class="panel-title">Členové <button class="panel-close" onclick="closePanel()">✕</button></div>
  <div id="panel-members-list"></div>
  <div class="panel-divider"></div>
  <button id="btn-admin" class="btn-panel-action btn-panel-admin" onclick="openPanel('admin')" style="display:none">⚙️ Správa uživatelů</button>
  <button class="btn-panel-action" style="color:#3A0CA3" onclick="enableNotifs()">🔔 Zapnout notifikace</button>
  <button class="btn-panel-action btn-panel-logout" onclick="logout()">👋 Odhlásit se</button>
</div>

<!-- ADMIN PANEL -->
<div class="side-panel" id="admin-panel">
  <div class="panel-title">⚙️ Správa <button class="panel-close" onclick="closePanel()">✕</button></div>
  <div id="admin-list"></div>
  <div class="panel-divider"></div>
  <button class="btn-panel-action btn-panel-logout" onclick="openPanel('members')">← Zpět</button>
</div>

<!-- Two separate inputs: gallery and camera -->
<input type="file" id="photo-input-gallery" accept="image/*">
<input type="file" id="photo-input-camera" accept="image/*" capture="environment">
<div class="toast" id="toast"></div>

<script>
const EMOJIS_REG  = ['👦','👧','🧔','👩','🧒','👶','🦸','🧙','🦊','🐻','🐼','🦁','🐯','🐸','🚀','⭐'];
const EMOJIS_CHAT = ['😀','😂','😍','🥰','😎','🤩','😊','😅','😭','😡','🥳','🎉','❤️','🔥','⭐','👍','👏','🙏','💪','✌️','🫶','🎮','⚽','🎵','🍕','🐶','🌈','🏆'];
const COLORS = ['#3A0CA3','#E76F51','#2D6A4F','#E63946','#0077B6','#8B5CF6','#D97706','#0891B2'];
const LIGHTS = ['#E0D7FF','#FFE8DF','#D8F3DC','#FFD6D8','#CCEEFF','#EDE9FE','#FEF3C7','#CFFAFE'];

let currentUser = null, allUsers = {}, loginPin = '', regPin = '', selectedEmoji = '👦', pendingPhoto = null;

// ===== INIT =====
window.addEventListener('load', function() {
  // Emoji register
  var sel = document.getElementById('emoji-selector');
  EMOJIS_REG.forEach(function(e) {
    var btn = document.createElement('div');
    btn.className = 'emoji-opt' + (e === selectedEmoji ? ' selected' : '');
    btn.textContent = e;
    btn.onclick = function() {
      selectedEmoji = e;
      document.querySelectorAll('.emoji-opt').forEach(function(b) { b.classList.remove('selected'); });
      btn.classList.add('selected');
    };
    sel.appendChild(btn);
  });

  // Emoji chat
  var picker = document.getElementById('emoji-picker');
  EMOJIS_CHAT.forEach(function(e) {
    var btn = document.createElement('button');
    btn.className = 'ep-btn'; btn.textContent = e;
    btn.onclick = function() { document.getElementById('msg-input').value += e; };
    picker.appendChild(btn);
  });

  document.getElementById('emoji-toggle').onclick = function() {
    document.getElementById('emoji-picker').classList.toggle('open');
  };
  document.getElementById('msg-input').addEventListener('keydown', function(e) {
    if (e.key === 'Enter' && !e.shiftKey) { e.preventDefault(); sendMsg(); }
  });
  document.addEventListener('click', function(e) {
    if (!e.target.closest('#emoji-picker') && !e.target.closest('#emoji-toggle'))
      document.getElementById('emoji-picker').classList.remove('open');
  });
  function handlePhotoSelect(e) {
    var file = e.target.files[0]; if (!file) return;
    var reader = new FileReader();
    reader.onload = function(ev) {
      pendingPhoto = { file: file, preview: ev.target.result };
      document.getElementById('photo-preview-img').src = ev.target.result;
      document.getElementById('photo-preview-wrap').classList.add('visible');
      document.getElementById('emoji-picker').classList.remove('open');
    };
    reader.readAsDataURL(file);
    e.target.value = ''; // reset so same file can be selected again
  }
  document.getElementById('photo-input-gallery').onchange = handlePhotoSelect;
  document.getElementById('photo-input-camera').onchange = handlePhotoSelect;

  // Register service worker + push notifications
  // FCM + Service Worker setup
  var FCM_VAPID = 'U7oLhpRjVvVuiy8KguCsUDt_1rc_juJYcMSlsu9kmxA';

  if ('serviceWorker' in navigator) {
    navigator.serviceWorker.getRegistrations().then(function(regs) {
      regs.forEach(function(reg) { reg.update(); });
    });
    navigator.serviceWorker.register('/kontakteen/sw.js?v=3')
      .then(function(reg) { window._swReg = reg; })
      .catch(function(e) { console.warn('SW:', e); });
  }

  // Listen for SCROLL_TO_MSG from SW notificationclick
  if ('serviceWorker' in navigator) {
    navigator.serviceWorker.addEventListener('message', function(e) {
      if (e.data && e.data.type === 'SCROLL_TO_MSG' && e.data.msgId) {
        var el = document.getElementById('msg-' + e.data.msgId);
        if (el) el.scrollIntoView({ behavior: 'smooth', block: 'center' });
      }
    });
  }

  window._FCM_VAPID = FCM_VAPID;

  // Wait for Firebase
  if (window._fbReady) { loadUsers(); }
  else { window._fbCb = loadUsers; }
});

// ===== TABS =====
function switchTab(t) {
  document.getElementById('tab-login').classList.toggle('active', t==='login');
  document.getElementById('tab-reg').classList.toggle('active', t==='register');
  document.getElementById('form-login').classList.toggle('active', t==='login');
  document.getElementById('form-register').classList.toggle('active', t==='register');
  loginPin = ''; regPin = ''; updateDots('l',''); updateDots('r','');
  document.getElementById('login-error').textContent = '';
  document.getElementById('reg-error').textContent = '';
  document.getElementById('reg-info').textContent = '';
}

// ===== KEYPAD =====
function pressKey(m, k) {
  if (m === 'l') {
    if (loginPin.length >= 4) return;
    loginPin += k; updateDots('l', loginPin);
    document.getElementById('login-error').textContent = '';
    if (loginPin.length === 4) setTimeout(checkLogin, 150);
  } else {
    if (regPin.length >= 4) return;
    regPin += k; updateDots('r', regPin);
  }
}
function delKey(m) {
  if (m === 'l') { loginPin = loginPin.slice(0,-1); updateDots('l', loginPin); }
  else { regPin = regPin.slice(0,-1); updateDots('r', regPin); }
}
function updateDots(p, pin) {
  for (var i=0; i<4; i++) {
    var el = document.getElementById((p==='l'?'ld':'rd')+i);
    if (el) el.classList.toggle('filled', i < pin.length);
  }
}

// ===== LOAD USERS =====
function loadUsers() {
  window._fb.get('users').then(function(snap) {
    allUsers = snap.val() || {};
    renderMembersList();
  }).catch(function(e) {
    allUsers = {};
    document.getElementById('members-list').innerHTML = '<div style="color:#FFB3C1;font-size:12px;font-weight:700;text-align:center;padding:8px">Chyba: ' + e.message + '</div>';
  });
}

function renderMembersList() {
  var list = document.getElementById('members-list');
  var entries = Object.entries(allUsers);
  if (entries.length === 0) {
    list.innerHTML = '<div style="color:rgba(255,255,255,0.5);font-size:12px;font-weight:700;text-align:center;padding:8px">Žádní členové — registruj se jako první!</div>';
    return;
  }
  list.innerHTML = '';
  entries.forEach(function(e) {
    var u = e[1];
    var row = document.createElement('div');
    row.className = 'member-row';
    row.innerHTML = '<span class="member-emoji">'+u.emoji+'</span><span class="member-name">'+u.name+'</span>'+(u.role==='admin'?'<span class="member-badge">admin</span>':'');
    list.appendChild(row);
  });
}

// ===== LOGIN =====
function checkLogin() {
  var entry = Object.entries(allUsers).find(function(e) { return e[1].pin === loginPin; });
  if (entry) {
    currentUser = Object.assign({ uid: entry[0] }, entry[1]);
    enterChat();
  } else {
    document.getElementById('login-error').textContent = '❌ Špatný PIN, zkus znovu';
    loginPin = ''; updateDots('l', loginPin);
  }
}

// ===== REGISTER =====
function doRegister() {
  var name = document.getElementById('reg-name').value.trim();
  var err = document.getElementById('reg-error');
  var info = document.getElementById('reg-info');
  err.textContent = ''; info.textContent = '';

  if (!window._fb) { err.textContent = '❌ Čekám na připojení…'; return; }
  if (!name) { err.textContent = '✏️ Zadej své jméno'; return; }
  if (!selectedEmoji) { err.textContent = '😊 Vyber si avatara'; return; }
  if (regPin.length < 4) { err.textContent = '🔢 Zadej 4místný PIN (' + regPin.length + '/4)'; return; }
  if (Object.values(allUsers).some(function(u) { return u.pin === regPin; })) {
    err.textContent = '❌ Tento PIN už někdo má'; regPin=''; updateDots('r',''); return;
  }

  info.textContent = '⏳ Ukládám…';
  var uid = 'u_' + Date.now();
  var isFirst = Object.keys(allUsers).length === 0;
  var colorIdx = Object.keys(allUsers).length % COLORS.length;
  var newUser = { name: name, emoji: selectedEmoji, pin: regPin, role: isFirst ? 'admin' : 'member', colorIdx: colorIdx };

  window._fb.set('users/' + uid, newUser).then(function() {
    allUsers[uid] = newUser;
    currentUser = Object.assign({ uid: uid }, newUser);
    enterChat();
  }).catch(function(e) {
    info.textContent = '';
    err.textContent = '❌ ' + e.message;
  });
}

// ===== ENTER CHAT =====
// ── Notification permission UI ──────────────────────────────────────────────
function showNotifBanner() {
  if (localStorage.getItem('kf_notif_asked') === '1') return;
  if (!('Notification' in window)) return;
  if (Notification.permission !== 'default') return;

  var banner = document.createElement('div');
  banner.id = 'notif-banner';
  banner.style.cssText = 'position:fixed;bottom:0;left:0;right:0;background:#3A0CA3;color:white;padding:14px 16px;display:flex;align-items:center;gap:10px;z-index:9999;font-family:Nunito,sans-serif;box-shadow:0 -4px 20px rgba(0,0,0,0.2);';
  banner.innerHTML = '<span style="font-size:22px">🔔</span>'
    + '<span style="flex:1;font-size:13px;font-weight:700;line-height:1.4">Chceš dostávat notifikace o nových zprávách?</span>'
    + '<button id="notif-yes" style="background:white;color:#3A0CA3;border:none;border-radius:10px;padding:8px 14px;font-family:Nunito,sans-serif;font-size:13px;font-weight:900;cursor:pointer;flex-shrink:0">Ano</button>'
    + '<button id="notif-no" style="background:rgba(255,255,255,0.15);color:white;border:none;border-radius:10px;padding:8px 12px;font-family:Nunito,sans-serif;font-size:13px;font-weight:700;cursor:pointer;flex-shrink:0">Teď ne</button>';
  document.body.appendChild(banner);

  document.getElementById('notif-yes').onclick = function() {
    localStorage.setItem('kf_notif_asked', '1');
    banner.remove();
    registerFCM();
  };
  document.getElementById('notif-no').onclick = function() {
    localStorage.setItem('kf_notif_asked', '1');
    banner.remove();
  };
}

function enableNotifs() {
  closePanel();
  if (!('Notification' in window)) { showToast('❌ Tvůj prohlížeč notifikace nepodporuje'); return; }
  if (Notification.permission === 'granted') {
    registerFCM();
    showToast('✅ Notifikace jsou zapnuté');
    return;
  }
  if (Notification.permission === 'denied') {
    showToast('⚠️ Notifikace jsou blokované v nastavení prohlížeče');
    return;
  }
  Notification.requestPermission().then(function(perm) {
    if (perm === 'granted') {
      localStorage.setItem('kf_notif_asked', '1');
      registerFCM();
      showToast('✅ Notifikace zapnuty!');
    } else {
      showToast('Notifikace nebyly povoleny');
    }
  });
}

function registerFCM() {
  if (!window._messagingReady) {
    window._messagingCb = registerFCM; return;
  }
  var messaging = firebase.messaging();
  messaging.getToken({ vapidKey: window._FCM_VAPID, serviceWorkerRegistration: window._swReg })
    .then(function(token) {
      if (!token || !currentUser) return;
      window._fb.set('users/' + currentUser.uid + '/fcmToken', token);
      // Refresh token handler
      messaging.onTokenRefresh(function() {
        messaging.getToken({ vapidKey: window._FCM_VAPID }).then(function(t) {
          if (t) window._fb.set('users/' + currentUser.uid + '/fcmToken', t);
        });
      });
    })
    .catch(function(e) { console.warn('FCM token error:', e.message); });
}

// ── document.title unread badge ──────────────────────────────────────────────
var _unreadCount = 0;
var _baseTitle = 'Kontakteen Ferdaan';
function setUnreadBadge(n) {
  _unreadCount = n;
  document.title = n > 0 ? '(' + n + ') ' + _baseTitle : _baseTitle;
}

function enterChat() {
  var color = COLORS[currentUser.colorIdx % COLORS.length];
  var light = LIGHTS[currentUser.colorIdx % LIGHTS.length];
  document.documentElement.style.setProperty('--user-color', color);
  document.documentElement.style.setProperty('--user-light', light);
  document.getElementById('welcome-screen').classList.remove('active');
  document.getElementById('chat-screen').classList.add('active');
  updateHeaderAvatars();
  renderPanelMembers();
  loadMessages();
  listenPushQueue();
  setTimeout(showNotifBanner, 3000);
  setUnreadBadge(0);

  // Reset unread when user returns to tab
  document.addEventListener('visibilitychange', function() {
    if (!document.hidden) setUnreadBadge(0);
  });
}

function updateHeaderAvatars() {
  var row = document.getElementById('header-members');
  row.innerHTML = '';
  Object.values(allUsers).slice(0,4).forEach(function(u) {
    var av = document.createElement('div');
    av.className = 'h-av'; av.textContent = u.emoji;
    row.appendChild(av);
  });
}

function renderPanelMembers() {
  var list = document.getElementById('panel-members-list');
  list.innerHTML = '';
  document.getElementById('btn-admin').style.display = currentUser.role === 'admin' ? 'block' : 'none';
  Object.entries(allUsers).forEach(function(e) {
    var uid = e[0], u = e[1];
    var light = LIGHTS[u.colorIdx % LIGHTS.length];
    var color = COLORS[u.colorIdx % COLORS.length];
    var div = document.createElement('div');
    div.className = 'panel-member';
    div.style.background = light;
    div.innerHTML = '<div class="panel-member-av">'+u.emoji+'</div><div class="panel-member-info"><h4>'+u.name+(u.role==='admin'?'<span class="admin-tag">admin</span>':'')+'</h4><p style="color:'+color+'">'+( uid===currentUser.uid?'— to jsi ty':'člen')+'</p></div>';
    list.appendChild(div);
  });
}

function renderAdminList() {
  var list = document.getElementById('admin-list');
  list.innerHTML = '';
  Object.entries(allUsers).forEach(function(e) {
    var uid = e[0], u = e[1];
    var light = LIGHTS[u.colorIdx % LIGHTS.length];
    var isMe = uid === currentUser.uid;
    var div = document.createElement('div');
    div.className = 'admin-user-row';
    div.style.background = light;
    div.innerHTML = '<div class="admin-user-top"><div class="admin-user-av">'+u.emoji+'</div><div class="admin-user-name">'+u.name+(isMe?' (ty)':'')+'</div><span class="role-tag '+(u.role==='admin'?'role-admin':'role-member')+'">'+(u.role==='admin'?'admin':'člen')+'</span></div>'
      + '<div class="admin-actions">'
      + (!isMe ? '<button class="btn-admin btn-del" onclick="deleteUser(\''+uid+'\')">🗑️ Smazat</button>' : '')
      + (!isMe && u.role!=='admin' ? '<button class="btn-admin btn-role" onclick="setRole(\''+uid+'\',\'admin\')">👑 Admin</button>' : '')
      + (!isMe && u.role==='admin' ? '<button class="btn-admin btn-role" onclick="setRole(\''+uid+'\',\'member\')">👤 Člen</button>' : '')
      + '</div>';
    list.appendChild(div);
  });
}

function deleteUser(uid) {
  if (!confirm('Smazat ' + allUsers[uid].name + '?')) return;
  window._fb.remove('users/' + uid).then(function() {
    delete allUsers[uid];
    showToast('✅ Uživatel smazán');
    renderAdminList(); renderPanelMembers(); updateHeaderAvatars();
  }).catch(function(e) { showToast('❌ ' + e.message); });
}

function setRole(uid, role) {
  window._fb.set('users/' + uid + '/role', role).then(function() {
    allUsers[uid].role = role;
    showToast(role==='admin' ? '👑 Admin přiřazen' : '👤 Role změněna');
    renderAdminList();
  }).catch(function(e) { showToast('❌ ' + e.message); });
}

// ===== PANEL =====
function openPanel(which) {
  closePanel();
  if (which === 'admin') { renderAdminList(); document.getElementById('admin-panel').classList.add('open'); }
  else { renderPanelMembers(); document.getElementById('members-panel').classList.add('open'); }
  document.getElementById('overlay').classList.add('open');
}
function closePanel() {
  document.getElementById('members-panel').classList.remove('open');
  document.getElementById('admin-panel').classList.remove('open');
  document.getElementById('overlay').classList.remove('open');
}

// ===== MESSAGES =====
function loadMessages() {
  var area = document.getElementById('messages-area');
  var lastDate = '';
  window._fb.on('messages', function(snap) {
    area.innerHTML = '';
    var data = snap.val();
    if (!data) { area.innerHTML = '<div class="empty-chat"><span>💬</span>Zatím žádné zprávy<br>Napiš první!</div>'; return; }
    var isFirstLoad = area.children.length === 0;
    Object.values(data).sort(function(a,b){return a.ts-b.ts;}).forEach(function(m) {
      var d = fmtDate(m.ts);
      if (d !== lastDate) { area.appendChild(mkDateLabel(d)); lastDate = d; }
      area.appendChild(mkRow(m));
    });
    area.scrollTop = area.scrollHeight;
  });
}

function mkRow(m) {
  var isMe = m.senderUid === currentUser.uid;
  var sender = allUsers[m.senderUid] || { name: m.senderName||'?', emoji:'❓', colorIdx:0 };
  var color = COLORS[sender.colorIdx % COLORS.length];
  var light = LIGHTS[sender.colorIdx % LIGHTS.length];
  var row = document.createElement('div');
  row.className = 'msg-row' + (isMe?' me':'');
  if (m.msgId) row.id = 'msg-' + m.msgId;
  var av = document.createElement('div');
  av.className = 'msg-av'; av.textContent = sender.emoji; av.style.background = light;
  var content = document.createElement('div');
  content.className = 'msg-content';
  if (!isMe) { var nm = document.createElement('div'); nm.className='sender-name'; nm.textContent=sender.name; content.appendChild(nm); }
  var bubble = document.createElement('div');
  if (m.type === 'photo') {
    bubble.className = 'bubble photo-bubble ' + (isMe?'me':'them');
    if (isMe) bubble.style.background = color;
    var img = document.createElement('img'); img.src = m.url; img.alt='Fotka';
    img.onclick = function() { window.open(m.url,'_blank'); };
    bubble.appendChild(img);
  } else {
    bubble.className = 'bubble ' + (isMe?'me':'them');
    if (isMe) bubble.style.background = color;
    bubble.textContent = m.text;
  }
  var time = document.createElement('div');
  time.className = 'msg-time';
  time.textContent = new Date(m.ts).toLocaleTimeString('cs-CZ',{hour:'2-digit',minute:'2-digit'});
  content.appendChild(bubble); content.appendChild(time);
  if (isMe) { row.appendChild(content); row.appendChild(av); }
  else { row.appendChild(av); row.appendChild(content); }
  return row;
}

function mkDateLabel(t) { var d=document.createElement('div'); d.className='date-label'; d.textContent=t; return d; }
function fmtDate(ts) { return new Date(ts).toLocaleDateString('cs-CZ',{weekday:'long',day:'numeric',month:'long'}); }

// ===== SEND =====
function sendMsg() {
  var input = document.getElementById('msg-input');
  var text = input.value.trim();
  if (!text && !pendingPhoto) return;
  input.value = '';
  document.getElementById('emoji-picker').classList.remove('open');
  if (pendingPhoto) { doSendPhoto(); return; }
  window._fb.push('messages', { senderUid:currentUser.uid, senderName:currentUser.name, type:'text', text:text, ts:Date.now() })
    .then(function() { sendPushToOthers(currentUser.name + ': ' + text); })
    .catch(function(e) { showToast('❌ '+e.message); });
}

function doSendPhoto() {
  showToast('⬆️ Zpracovávám…');
  var canvas = document.createElement('canvas');
  var img = new Image();
  img.onload = function() {
    var MAX=800, w=img.width, h=img.height;
    if (w>MAX||h>MAX) { if(w>h){h=Math.round(h*MAX/w);w=MAX;}else{w=Math.round(w*MAX/h);h=MAX;} }
    canvas.width=w; canvas.height=h;
    canvas.getContext('2d').drawImage(img,0,0,w,h);
    var b64 = canvas.toDataURL('image/jpeg', 0.7);
    window._fb.push('messages', { senderUid:currentUser.uid, senderName:currentUser.name, type:'photo', url:b64, ts:Date.now() })
      .then(function() { clearPhoto(); showToast('✅ Fotka odeslána!'); })
      .catch(function(e) { showToast('❌ '+e.message); });
  };
  img.src = pendingPhoto.preview;
}

function clearPhoto() {
  pendingPhoto = null;
  document.getElementById('photo-preview-wrap').classList.remove('visible');
  document.getElementById('photo-preview-img').src = '';
  document.getElementById('photo-input-gallery').value = '';
  document.getElementById('photo-input-camera').value = '';
}

function logout() {
  closePanel(); currentUser=null; loginPin=''; regPin='';
  updateDots('l',''); updateDots('r','');
  document.getElementById('login-error').textContent='';
  document.getElementById('chat-screen').classList.remove('active');
  document.getElementById('welcome-screen').classList.add('active');
  document.getElementById('messages-area').innerHTML='<div class="empty-chat"><span>💬</span>Zatím žádné zprávy</div>';
  clearPhoto(); loadUsers();
}

function sendPushToOthers(body) {
  // Get all subscriptions from DB and send push via Web Push API
  // Since we can't do server-side push from browser directly,
  // we store a 'pending_push' node that other clients check
  if (!window._fb || !currentUser) return;
  window._fb.push('push_queue', {
    from: currentUser.uid,
    fromName: currentUser.name,
    body: body,
    ts: Date.now()
  }).catch(function() {});
}

// Listen for push queue and send browser notifications to this device
function listenPushQueue() {
  if (!window._fb) return;
  var lastTs = Date.now();
  window._fb.on('push_queue', function(snap) {
    var data = snap.val();
    if (!data) return;
    var items = Object.values(data).filter(function(item) {
      return item.ts > lastTs && item.from !== currentUser.uid;
    });
    items.forEach(function(item) {
      lastTs = Math.max(lastTs, item.ts);
      if (Notification.permission === 'granted' && document.hidden) {
        new Notification('💬 ' + item.fromName, {
          body: item.body,
          icon: 'https://raw.githubusercontent.com/twitter/twemoji/master/assets/72x72/1f46a.png',
          tag: 'kontakteen',
          renotify: true
        });
      }
    });
  });
}

function showToast(msg) {
  var t=document.getElementById('toast'); t.textContent=msg; t.classList.add('show');
  setTimeout(function(){t.classList.remove('show');},2500);
}
