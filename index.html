<style>
:root {
  --bg: #F5F0FF;
  --text: #1A1A2E;
  --muted: #9494AA;
  --white: #FFFFFF;
  --admin-color: #3A0CA3;
  --admin-light: #E0D7FF;
  --user-color: #3A0CA3;
  --user-light: #E0D7FF;
}

* { box-sizing: border-box; margin: 0; padding: 0; -webkit-tap-highlight-color: transparent; }

html { height: 100%; }
body { height: 100%; font-family: 'Nunito', sans-serif; background: var(--bg); overflow: hidden; }

/* SCREENS */
.screen { display: none; width: 100%; height: 100%; flex-direction: column; }
.screen.active { display: flex; }

/* ===== WELCOME SCREEN ===== */
#welcome-screen {
  background: linear-gradient(150deg, #3A0CA3 0%, #7B2FBE 50%, #F72585 100%);
  overflow-y: auto;
  overflow-x: hidden;
  align-items: center;
  justify-content: flex-start;
  padding: 24px 16px 40px;
  -webkit-overflow-scrolling: touch;
}

#welcome-screen::-webkit-scrollbar { width: 0; }

.welcome-card {
  background: rgba(255,255,255,0.1);
  backdrop-filter: blur(24px);
  border: 1px solid rgba(255,255,255,0.2);
  border-radius: 24px;
  padding: 22px 18px;
  width: 100%;
  max-width: 360px;
  text-align: center;
  flex-shrink: 0;
}

.welcome-logo { font-size: 48px; margin-bottom: 6px; }
.welcome-title { font-family:'Caveat',cursive; font-size:28px; font-weight:700; color:white; margin-bottom:3px; }
.welcome-sub { font-size:12px; color:rgba(255,255,255,0.65); font-weight:600; margin-bottom:20px; }

.tabs { display:flex; background:rgba(255,255,255,0.1); border-radius:12px; padding:3px; margin-bottom:16px; }
.tab { flex:1; padding:8px; border:none; border-radius:9px; font-family:'Nunito',sans-serif; font-size:13px; font-weight:800; cursor:pointer; transition:all 0.2s; background:transparent; color:rgba(255,255,255,0.6); }
.tab.active { background:white; color:var(--admin-color); }

.form-section { display:none; }
.form-section.active { display:block; }

.emoji-selector { display:flex; flex-wrap:wrap; gap:5px; justify-content:center; margin-bottom:12px; }
.emoji-opt { font-size:24px; padding:5px; border-radius:9px; cursor:pointer; border:2px solid transparent; transition:all 0.15s; background:rgba(255,255,255,0.1); }
.emoji-opt.selected { border-color:white; background:rgba(255,255,255,0.25); transform:scale(1.15); }

.field { width:100%; background:rgba(255,255,255,0.12); border:2px solid rgba(255,255,255,0.2); border-radius:12px; padding:10px 14px; font-family:'Nunito',sans-serif; font-size:15px; font-weight:700; color:white; outline:none; margin-bottom:10px; text-align:center; }
.field::placeholder { color:rgba(255,255,255,0.4); }
.field:focus { border-color:rgba(255,255,255,0.6); }

.pin-dots { display:flex; justify-content:center; gap:12px; margin:10px 0; }
.pin-dot { width:13px; height:13px; border-radius:50%; border:2px solid rgba(255,255,255,0.4); transition:all 0.2s; }
.pin-dot.filled { background:white; border-color:white; transform:scale(1.2); }

.keypad { display:grid; grid-template-columns:repeat(3,1fr); gap:7px; }
.key { background:rgba(255,255,255,0.12); border:1px solid rgba(255,255,255,0.15); border-radius:12px; padding:13px 8px; color:white; font-family:'Nunito',sans-serif; font-size:20px; font-weight:800; cursor:pointer; transition:all 0.15s; user-select:none; touch-action:manipulation; }
.key:active { background:rgba(255,255,255,0.3); transform:scale(0.92); }
.key.empty { visibility:hidden; }

.btn-primary { width:100%; padding:12px; background:white; color:var(--admin-color); border:none; border-radius:12px; font-family:'Nunito',sans-serif; font-size:15px; font-weight:900; cursor:pointer; margin-top:10px; touch-action:manipulation; }
.btn-primary:active { transform:scale(0.97); opacity:0.9; }

.form-error { color:#FFB3C1; font-size:12px; font-weight:700; min-height:18px; margin-top:6px; }

.members-list { display:flex; flex-direction:column; gap:7px; margin-bottom:10px; max-height:180px; overflow-y:auto; }
.member-row { display:flex; align-items:center; gap:10px; background:rgba(255,255,255,0.1); border-radius:12px; padding:9px 12px; cursor:pointer; transition:all 0.15s; border:2px solid transparent; touch-action:manipulation; }
.member-row.selected { border-color:white; background:rgba(255,255,255,0.2); }
.member-emoji { font-size:22px; }
.member-name { color:white; font-size:14px; font-weight:800; flex:1; text-align:left; }
.member-badge { font-size:10px; background:rgba(255,255,255,0.2); color:white; padding:2px 7px; border-radius:8px; font-weight:700; }

/* ===== CHAT SCREEN ===== */
#chat-screen {
  background: var(--bg);
  height: 100%;
  overflow: hidden;
}

.chat-header {
  background: var(--user-color);
  padding: 12px 14px;
  padding-top: max(env(safe-area-inset-top, 0px), 12px);
  display:flex; align-items:center; gap:10px;
  box-shadow: 0 3px 16px rgba(0,0,0,0.15);
  flex-shrink:0;
}

.members-row { display:flex; }
.h-av { width:32px; height:32px; border-radius:50%; border:2px solid rgba(255,255,255,0.3); display:flex; align-items:center; justify-content:center; font-size:15px; background:rgba(255,255,255,0.15); margin-left:-6px; flex-shrink:0; }
.h-av:first-child { margin-left:0; }

.header-info { flex:1; }
.header-info h2 { color:white; font-size:15px; font-weight:900; }
.header-info p { color:rgba(255,255,255,0.65); font-size:11px; font-weight:600; }
.online-dot { display:inline-block; width:6px; height:6px; background:#B9FBC0; border-radius:50%; margin-right:4px; animation:pulse 2s infinite; }
@keyframes pulse { 0%,100%{opacity:1} 50%{opacity:0.4} }

.btn-menu { background:rgba(255,255,255,0.15); border:none; border-radius:10px; color:white; padding:6px 10px; font-size:18px; cursor:pointer; touch-action:manipulation; }

/* MESSAGES */
.messages-area {
  flex:1;
  overflow-y: auto;
  overflow-x: hidden;
  padding: 12px 10px;
  display:flex;
  flex-direction:column;
  gap:5px;
  -webkit-overflow-scrolling: touch;
}
.messages-area::-webkit-scrollbar { width:0; }

.demo-banner { background:linear-gradient(135deg,#ede7ff,#d7c8ff); border:2px dashed #7B2FBE; border-radius:12px; padding:9px 12px; text-align:center; font-size:11px; font-weight:700; color:#4A1481; margin-bottom:5px; }
.date-label { text-align:center; font-size:11px; color:var(--muted); font-weight:800; margin:6px 0 3px; }

.msg-row { display:flex; align-items:flex-end; gap:6px; }
.msg-row.me { flex-direction:row-reverse; }

.msg-av { width:28px; height:28px; border-radius:50%; display:flex; align-items:center; justify-content:center; font-size:14px; flex-shrink:0; background:var(--bg); }
.msg-content { max-width:75%; display:flex; flex-direction:column; gap:2px; }
.msg-row.me .msg-content { align-items:flex-end; }

.sender-name { font-size:10px; font-weight:800; color:var(--muted); padding:0 3px; }
.bubble { padding:8px 12px; border-radius:16px; font-size:14px; line-height:1.5; font-weight:600; word-break:break-word; }
.bubble.them { background:white; color:var(--text); border-bottom-left-radius:3px; box-shadow:0 1px 6px rgba(0,0,0,0.07); }
.bubble.me { background:var(--user-color); color:white; border-bottom-right-radius:3px; }
.bubble.photo-bubble { padding:4px; }
.bubble.photo-bubble.them { border-bottom-left-radius:3px; }
.bubble.photo-bubble.me { border-bottom-right-radius:3px; border-bottom-left-radius:16px; }
.bubble img { width:180px; max-width:100%; height:140px; object-fit:cover; border-radius:12px; display:block; }
.msg-time { font-size:10px; color:var(--muted); font-weight:700; padding:0 3px; }

.empty-chat { display:flex; flex-direction:column; align-items:center; justify-content:center; flex:1; gap:8px; color:var(--muted); font-weight:700; font-size:14px; text-align:center; padding:20px; }
.empty-chat span { font-size:40px; }

/* EMOJI PICKER */
.emoji-picker { display:none; flex-wrap:wrap; gap:4px; padding:8px 10px; background:white; border-top:1px solid rgba(0,0,0,0.06); max-height:100px; overflow-y:auto; flex-shrink:0; }
.emoji-picker.open { display:flex; }
.ep-btn { font-size:22px; cursor:pointer; border:none; background:none; border-radius:7px; padding:3px; touch-action:manipulation; }

/* INPUT */
.input-area { background:white; border-top:1px solid rgba(0,0,0,0.06); flex-shrink:0; padding-bottom:env(safe-area-inset-bottom,0); }
.photo-preview-wrap { display:none; align-items:center; gap:8px; padding:7px 10px 0; }
.photo-preview-wrap.visible { display:flex; }
.photo-preview-wrap img { width:48px; height:48px; object-fit:cover; border-radius:9px; border:2px solid var(--user-color); }
.photo-preview-wrap button { background:none; border:none; cursor:pointer; font-size:18px; color:var(--muted); }
.photo-preview-wrap span { font-size:11px; font-weight:700; color:var(--muted); }

.input-row { display:flex; align-items:center; gap:7px; padding:8px 10px; }
.btn-c { width:38px; height:38px; border-radius:50%; border:none; display:flex; align-items:center; justify-content:center; font-size:17px; cursor:pointer; flex-shrink:0; touch-action:manipulation; }
.btn-c:active { opacity:0.7; transform:scale(0.92); }
.btn-emoji-c { background:#F3EEFF; }
.btn-photo-c { background:var(--user-light); }
.btn-send-c { background:var(--user-color); color:white; font-size:14px; }

.input-field { flex:1; background:var(--bg); border:2px solid transparent; border-radius:20px; padding:8px 13px; font-family:'Nunito',sans-serif; font-size:14px; font-weight:600; color:var(--text); outline:none; min-width:0; }
.input-field:focus { border-color:var(--user-color); }
.input-field::placeholder { color:var(--muted); }
#photo-input { display:none; }

/* MEMBERS PANEL */
.members-panel { display:none; position:fixed; top:0; right:0; bottom:0; width:260px; background:white; z-index:100; box-shadow:-4px 0 30px rgba(0,0,0,0.12); flex-direction:column; padding:20px 14px; overflow-y:auto; }
.members-panel.open { display:flex; }
.panel-title { font-size:17px; font-weight:900; color:var(--text); margin-bottom:14px; display:flex; justify-content:space-between; align-items:center; }
.panel-close { background:none; border:none; font-size:22px; cursor:pointer; color:var(--muted); }
.panel-member { display:flex; align-items:center; gap:10px; padding:9px 11px; border-radius:12px; margin-bottom:5px; }
.panel-member-av { font-size:26px; }
.panel-member-info h4 { font-size:13px; font-weight:800; color:var(--text); }
.panel-member-info p { font-size:11px; color:var(--muted); font-weight:600; }
.admin-tag { background:var(--admin-light); color:var(--admin-color); font-size:10px; font-weight:800; padding:1px 7px; border-radius:7px; margin-left:5px; }
.panel-divider { height:1px; background:rgba(0,0,0,0.06); margin:10px 0; }
.btn-logout-panel { width:100%; padding:11px; background:var(--bg); border:none; border-radius:12px; font-family:'Nunito',sans-serif; font-size:14px; font-weight:800; color:var(--muted); cursor:pointer; margin-top:auto; touch-action:manipulation; }

.overlay { display:none; position:fixed; inset:0; background:rgba(0,0,0,0.3); z-index:99; }
.overlay.open { display:block; }

/* TOAST */
.toast { position:fixed; bottom:80px; left:50%; transform:translateX(-50%) translateY(20px); background:rgba(26,26,46,0.9); color:white; padding:9px 18px; border-radius:18px; font-size:13px; font-weight:700; opacity:0; transition:all 0.3s; z-index:999; white-space:nowrap; pointer-events:none; }
.toast.show { opacity:1; transform:translateX(-50%) translateY(0); }
</style>
</head>

<script>
const EMOJIS_REG = ['👦','👧','🧔','👩','🧒','👶','🦸','🧙','🦊','🐻','🐼','🦁','🐯','🐸','🚀','⭐'];
const EMOJIS_CHAT = ['😀','😂','😍','🥰','😎','🤩','😊','😅','😭','😡','🥳','🎉','❤️','🔥','⭐','👍','👏','🙏','💪','✌️','🫶','🎮','⚽','🎵','🍕','🐶','🌈','🏆'];
const COLORS = ['#3A0CA3','#E76F51','#2D6A4F','#E63946','#0077B6','#8B5CF6','#D97706','#0891B2'];
const LIGHTS = ['#E0D7FF','#FFE8DF','#D8F3DC','#FFD6D8','#CCEEFF','#EDE9FE','#FEF3C7','#CFFAFE'];

const fb = window._fb;
let currentUser = null;
let allUsers = {};
let loginPin = '';
let regPin = '';
let selectedEmoji = '👦';
let pendingPhoto = null;

// ===== INIT =====
window.addEventListener('load', () => {
  // Emoji register
  const sel = document.getElementById('emoji-selector');
  EMOJIS_REG.forEach(e => {
    const btn = document.createElement('div');
    btn.className = 'emoji-opt' + (e === selectedEmoji ? ' selected' : '');
    btn.textContent = e;
    btn.addEventListener('click', () => {
      selectedEmoji = e;
      document.querySelectorAll('.emoji-opt').forEach(b => b.classList.remove('selected'));
      btn.classList.add('selected');
    });
    sel.appendChild(btn);
  });

  // Emoji chat picker
  const picker = document.getElementById('emoji-picker');
  EMOJIS_CHAT.forEach(e => {
    const btn = document.createElement('button');
    btn.className = 'ep-btn'; btn.textContent = e;
    btn.addEventListener('click', () => {
      document.getElementById('msg-input').value += e;
      document.getElementById('msg-input').focus();
    });
    picker.appendChild(btn);
  });

  document.getElementById('emoji-toggle').addEventListener('click', () => {
    document.getElementById('emoji-picker').classList.toggle('open');
  });

  document.getElementById('msg-input').addEventListener('keydown', e => {
    if (e.key === 'Enter' && !e.shiftKey) { e.preventDefault(); sendMsg(); }
  });

  document.addEventListener('click', e => {
    if (!e.target.closest('#emoji-picker') && !e.target.closest('#emoji-toggle')) {
      document.getElementById('emoji-picker').classList.remove('open');
    }
  });

  document.getElementById('photo-input').addEventListener('change', e => {
    const file = e.target.files[0]; if (!file) return;
    const reader = new FileReader();
    reader.onload = ev => {
      pendingPhoto = { file, preview: ev.target.result };
      document.getElementById('photo-preview-img').src = ev.target.result;
      document.getElementById('photo-preview-wrap').classList.add('visible');
    };
    reader.readAsDataURL(file);
  });

  // Wait for Firebase to be ready
  if (window._fbReady) {
    loadUsers();
  } else {
    window._fbReadyCb = loadUsers;
    setTimeout(function() {
      if (!window._fbReady) dbg('TIMEOUT: Firebase se nenačetl - zkontroluj připojení k internetu');
    }, 5000);
  }
});

// ===== TAB SWITCH =====
function switchTab(t) {
  document.getElementById('tab-login').classList.toggle('active', t === 'login');
  document.getElementById('tab-reg').classList.toggle('active', t === 'register');
  document.getElementById('form-login').classList.toggle('active', t === 'login');
  document.getElementById('form-register').classList.toggle('active', t === 'register');
  loginPin = ''; regPin = '';
  updateDots('ld', ''); updateDots('rd', '');
  document.getElementById('login-error').textContent = '';
  document.getElementById('reg-error').textContent = '';
}

// ===== KEYPAD =====
function pressKey(mode, k) {
  if (mode === 'login') {
    if (loginPin.length >= 4) return;
    loginPin += k;
    updateDots('ld', loginPin);
    document.getElementById('login-error').textContent = '';
    if (loginPin.length === 4) setTimeout(checkLogin, 150);
  } else {
    if (regPin.length >= 4) return;
    regPin += k;
    updateDots('rd', regPin);
  }
}

function delKey(mode) {
  if (mode === 'login') { loginPin = loginPin.slice(0,-1); updateDots('ld', loginPin); }
  else { regPin = regPin.slice(0,-1); updateDots('rd', regPin); }
}

function updateDots(prefix, pin) {
  for (let i = 0; i < 4; i++) {
    const el = document.getElementById(`${prefix}${i}`);
    if (el) el.classList.toggle('filled', i < pin.length);
  }
}

// ===== LOAD USERS =====
function loadUsers() {
  dbg('Načítám uživatele z Firebase...');
  fb.get(fb.ref(fb.db, 'users')).then(snap => {
    allUsers = snap.val() || {};
    dbg('Uživatelé načteni: ' + Object.keys(allUsers).length);
    renderMembersList();
  }).catch(e => {
    dbg('CHYBA načítání: ' + e.code + ' / ' + e.message);
    allUsers = {};
    renderMembersList();
  });
}

function renderMembersList() {
  const list = document.getElementById('members-list');
  const entries = Object.entries(allUsers);
  if (entries.length === 0) {
    list.innerHTML = '<div style="color:rgba(255,255,255,0.5);font-size:12px;font-weight:700;text-align:center;padding:8px">Žádní členové — vytvoř první účet!</div>';
    return;
  }
  list.innerHTML = '';
  entries.forEach(([uid, u]) => {
    const row = document.createElement('div');
    row.className = 'member-row';
    row.innerHTML = `<span class="member-emoji">${u.emoji}</span><span class="member-name">${u.name}</span>${u.role==='admin'?'<span class="member-badge">admin</span>':''}`;
    list.appendChild(row);
  });
}

// ===== LOGIN =====
function checkLogin() {
  const entry = Object.entries(allUsers).find(([,u]) => u.pin === loginPin);
  if (entry) {
    const [uid, u] = entry;
    currentUser = { uid, ...u };
    enterChat();
  } else {
    document.getElementById('login-error').textContent = '❌ Špatný PIN, zkus znovu';
    loginPin = ''; updateDots('ld', loginPin);
  }
}

// ===== REGISTER =====
function doRegister() {
  const name = document.getElementById("reg-name").value.trim();
  const err = document.getElementById("reg-error");
  err.style.color = "#FFB3C1";
  err.textContent = "";

  if (!name) { err.textContent = "✏️ Zadej své jméno"; return; }
  if (regPin.length < 4) { err.textContent = "🔢 Zadej 4místný PIN"; regPin=""; updateDots("rd",""); return; }

  const pinExists = Object.values(allUsers).some(u => u.pin === regPin);
  if (pinExists) { err.textContent = "❌ Tento PIN už někdo má"; regPin=""; updateDots("rd",""); return; }

  err.style.color = "rgba(255,255,255,0.8)";
  err.textContent = "⏳ Ukládám...";

  const uid = "u_" + Date.now();
  const isFirst = Object.keys(allUsers).length === 0;
  const colorIdx = Object.keys(allUsers).length % COLORS.length;
  const newUser = { name, emoji: selectedEmoji, pin: regPin, role: isFirst ? "admin" : "member", colorIdx };

  fb.set(fb.ref(fb.db, "users/" + uid), newUser)
    .then(() => {
      allUsers[uid] = newUser;
      currentUser = { uid, ...newUser };
      enterChat();
    })
    .catch(e => {
      err.style.color = "#FFB3C1";
      err.textContent = "❌ " + e.message;
    });
}

// ===== ENTER CHAT =====
function enterChat() {
  const color = COLORS[currentUser.colorIdx % COLORS.length];
  const light = LIGHTS[currentUser.colorIdx % LIGHTS.length];
  document.documentElement.style.setProperty('--user-color', color);
  document.documentElement.style.setProperty('--user-light', light);

  document.getElementById('welcome-screen').classList.remove('active');
  document.getElementById('chat-screen').classList.add('active');

  updateHeaderAvatars();
  renderPanelMembers();
  loadMessages();
}

function updateHeaderAvatars() {
  const row = document.getElementById('header-members');
  row.innerHTML = '';
  Object.values(allUsers).slice(0,4).forEach(u => {
    const av = document.createElement('div');
    av.className = 'h-av'; av.textContent = u.emoji;
    row.appendChild(av);
  });
}

function renderPanelMembers() {
  const list = document.getElementById('panel-members-list');
  list.innerHTML = '';
  Object.entries(allUsers).forEach(([uid, u]) => {
    const color = COLORS[u.colorIdx % COLORS.length];
    const light = LIGHTS[u.colorIdx % LIGHTS.length];
    const div = document.createElement('div');
    div.className = 'panel-member';
    div.style.background = light; div.style.borderRadius = '12px';
    div.innerHTML = `<div class="panel-member-av">${u.emoji}</div>
      <div class="panel-member-info">
        <h4>${u.name}${u.role==='admin'?'<span class="admin-tag">admin</span>':''}</h4>
        <p style="color:${color};font-weight:700">${uid===currentUser.uid?'— to jsi ty':'člen rodiny'}</p>
      </div>`;
    list.appendChild(div);
  });
}

// ===== MESSAGES =====
function loadMessages() {
  const area = document.getElementById('messages-area');
  area.innerHTML = '';
  let lastDate = '';

  fb.onValue(fb.ref(fb.db, 'messages'), snap => {
    area.innerHTML = '';
    lastDate = '';
    const data = snap.val();
    if (!data) {
      area.innerHTML = '<div class="empty-chat"><span>💬</span>Zatím žádné zprávy<br>Napiš první!</div>';
      return;
    }
    Object.values(data).sort((a,b) => a.ts - b.ts).forEach(m => {
      const d = fmtDate(m.ts);
      if (d !== lastDate) { area.appendChild(mkDateLabel(d)); lastDate = d; }
      area.appendChild(mkRow(m));
    });
    area.scrollTop = area.scrollHeight;
  });
}

function mkRow(m) {
  const isMe = m.senderUid === currentUser.uid;
  const sender = allUsers[m.senderUid] || { name: m.senderName || '?', emoji: '❓', colorIdx: 0 };
  const color = COLORS[sender.colorIdx % COLORS.length];
  const light = LIGHTS[sender.colorIdx % LIGHTS.length];

  const row = document.createElement('div');
  row.className = `msg-row ${isMe ? 'me' : ''}`;

  const av = document.createElement('div');
  av.className = 'msg-av'; av.textContent = sender.emoji; av.style.background = light;

  const content = document.createElement('div');
  content.className = 'msg-content';

  if (!isMe) {
    const name = document.createElement('div');
    name.className = 'sender-name'; name.textContent = sender.name;
    content.appendChild(name);
  }

  const bubble = document.createElement('div');
  if (m.type === 'photo') {
    bubble.className = `bubble photo-bubble ${isMe ? 'me' : 'them'}`;
    bubble.style.background = isMe ? color : 'white';
    const img = document.createElement('img');
    img.src = m.url; img.alt = 'Fotka';
    img.addEventListener('click', () => window.open(m.url, '_blank'));
    bubble.appendChild(img);
  } else {
    bubble.className = `bubble ${isMe ? 'me' : 'them'}`;
    if (isMe) bubble.style.background = color;
    bubble.textContent = m.text;
  }

  const time = document.createElement('div');
  time.className = 'msg-time';
  time.textContent = new Date(m.ts).toLocaleTimeString('cs-CZ', { hour:'2-digit', minute:'2-digit' });

  content.appendChild(bubble);
  content.appendChild(time);

  if (isMe) { row.appendChild(content); row.appendChild(av); }
  else { row.appendChild(av); row.appendChild(content); }
  return row;
}

function mkDateLabel(t) {
  const d = document.createElement('div'); d.className = 'date-label'; d.textContent = t; return d;
}

function fmtDate(ts) {
  return new Date(ts).toLocaleDateString('cs-CZ', { weekday:'long', day:'numeric', month:'long' });
}

// ===== SEND =====
async function sendMsg() {
  const input = document.getElementById('msg-input');
  const text = input.value.trim();
  if (!text && !pendingPhoto) return;
  input.value = '';
  document.getElementById('emoji-picker').classList.remove('open');
  if (pendingPhoto) { await doSendPhoto(); return; }

  await fb.push(fb.ref(fb.db, 'messages'), {
    senderUid: currentUser.uid,
    senderName: currentUser.name,
    type: 'text', text, ts: Date.now()
  }).catch(e => showToast('❌ ' + e.message));
}

async function doSendPhoto() {
  showToast('⬆️ Zpracovávám fotku…');
  try {
    // Resize image to max 800px and compress to keep under Firebase 1MB limit
    const canvas = document.createElement('canvas');
    const img = new Image();
    img.src = pendingPhoto.preview;
    await new Promise(r => img.onload = r);
    const MAX = 800;
    let w = img.width, h = img.height;
    if (w > MAX || h > MAX) {
      if (w > h) { h = Math.round(h * MAX / w); w = MAX; }
      else { w = Math.round(w * MAX / h); h = MAX; }
    }
    canvas.width = w; canvas.height = h;
    canvas.getContext('2d').drawImage(img, 0, 0, w, h);
    const base64 = canvas.toDataURL('image/jpeg', 0.7);

    await fb.push(fb.ref(fb.db, 'messages'), {
      senderUid: currentUser.uid, senderName: currentUser.name,
      type: 'photo', url: base64, ts: Date.now()
    });
    clearPhoto(); showToast('✅ Fotka odeslána!');
  } catch(e) { showToast('❌ Chyba: ' + e.message); }
}

function clearPhoto() {
  pendingPhoto = null;
  document.getElementById('photo-preview-wrap').classList.remove('visible');
  document.getElementById('photo-preview-img').src = '';
  document.getElementById('photo-input').value = '';
}

function openPanel() { document.getElementById('members-panel').classList.add('open'); document.getElementById('overlay').classList.add('open'); }
function closePanel() { document.getElementById('members-panel').classList.remove('open'); document.getElementById('overlay').classList.remove('open'); }

function logout() {
  closePanel(); currentUser = null; loginPin = ''; regPin = '';
  updateDots('ld',''); updateDots('rd','');
  document.getElementById('login-error').textContent = '';
  document.getElementById('chat-screen').classList.remove('active');
  document.getElementById('welcome-screen').classList.add('active');
  document.getElementById('messages-area').innerHTML = '<div class="empty-chat"><span>💬</span>Zatím žádné zprávy</div>';
  clearPhoto();
  // Wait for Firebase to be ready
  if (window._fbReady) {
    loadUsers();
  } else {
    window._fbReadyCb = loadUsers;
    setTimeout(function() {
      if (!window._fbReady) dbg('TIMEOUT: Firebase se nenačetl - zkontroluj připojení k internetu');
    }, 5000);
  }
}

function dbg(msg) {
  const p = document.getElementById('debug-panel');
  p.style.display = 'block';
  p.textContent += new Date().toLocaleTimeString() + ': ' + msg + '\n';
  p.scrollTop = p.scrollHeight;
  console.log('[DBG]', msg);
}

function showToast(msg) {
  const t = document.getElementById('toast'); t.textContent = msg; t.classList.add('show');
  setTimeout(() => t.classList.remove('show'), 2500);
}
</script>
